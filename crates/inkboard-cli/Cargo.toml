[package]
name = "inkboard-cli"
description = "Conversion en ligne de commande entre les formats du tableau blanc."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ink"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
inkboard-core = { path = "../inkboard-core" }
inkboard-formats = { path = "../inkboard-formats" }

[lints]
workspace = true
