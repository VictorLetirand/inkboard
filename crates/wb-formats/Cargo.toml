[package]
name = "wb-formats"
description = "Import/export : draw.io, Excalidraw, JSON Canvas, Mermaid, ancien format du prototype web."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.10"
percent-encoding = "2.3.2"
quick-xml = "0.41.0"
regex = "1.13.1"
resvg = "0.48.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
svg2pdf = { version = "0.13", default-features = false, features = ["text", "image"] }
thiserror = "2.0.21"
wb-core = { path = "../wb-core" }

[lints]
workspace = true
