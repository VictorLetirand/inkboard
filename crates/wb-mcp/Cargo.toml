[package]
name = "wb-mcp"
description = "Serveur MCP (stdio) du tableau blanc : permet à un agent de créer et modifier des tableaux (fichiers .tableau.json), d'importer du Mermaid et d'exporter."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "wb_mcp"
path = "src/lib.rs"

[[bin]]
name = "wb-mcp"
path = "src/main.rs"

[dependencies]
serde_json = "1.0.154"
wb-core = { path = "../wb-core" }
wb-formats = { path = "../wb-formats" }

[lints]
workspace = true
