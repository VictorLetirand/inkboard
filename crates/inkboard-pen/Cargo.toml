[package]
name = "inkboard-pen"
description = "Pen eraser detection (\"eraser\" end or button) through the Windows Pointer API, which winit/egui do not expose."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Synthetic pen injection for `tests/synthetic.rs` (ignored tests, need a desktop session).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# The only crate of the project that contains `unsafe` code (Win32 calls); the others forbid it (`unsafe_code = "forbid"`).
[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
