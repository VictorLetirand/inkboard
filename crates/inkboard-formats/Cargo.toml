[package]
name = "inkboard-formats"
description = "Import/export: draw.io, Excalidraw, JSON Canvas, Mermaid, legacy web-prototype format."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23.1"
epaint_default_fonts = "0.33.3"
flate2 = "1.1.10"
latex-rust = "2.1.1"
percent-encoding = "2.3.2"
quick-xml = "0.41.0"
regex = "1.13.1"
resvg = "0.48.1"
serde_json = "1.0.154"
svg2pdf = { version = "0.13", default-features = false, features = ["text", "image"] }
thiserror = "2.0.21"
inkboard-core = { path = "../inkboard-core" }
inkboard-icons = { path = "../inkboard-icons" }

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[lints]
workspace = true
