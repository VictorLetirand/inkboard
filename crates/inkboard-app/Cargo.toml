[package]
name = "inkboard-app"
description = "Inkboard desktop application (egui)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "inkboard"
path = "src/main.rs"

[features]
# Web renderers (wasm32 only; the desktop build is unaffected). eframe compiles ONE painter for the web: `glow` wins if both are on.
web-glow = ["eframe/glow"]
web-wgpu = ["eframe/wgpu", "dep:wgpu"]

[dependencies]
inkboard-fonts = { path = "../inkboard-fonts" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rfd = "0.17.2"
serde_json = "1.0.154"
inkboard-core = { path = "../inkboard-core" }
inkboard-pen = { path = "../inkboard-pen" }
inkboard-formats = { path = "../inkboard-formats" }
inkboard-icons = { path = "../inkboard-icons" }
inkboard-session = { path = "../inkboard-session" }

# Desktop only: system clipboard, window handle, MCP server (live mode, data folder), network transport, system language, the
# embedded icon pack (the web build fetches it on demand).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.7.0"
eframe = { version = "0.33.3", features = ["wgpu"] }
raw-window-handle = "0.6.2"
inkboard-mcp = { path = "../inkboard-mcp" }
inkboard-net = { path = "../inkboard-net" }
sys-locale = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "web_screen_reader"] }
sys-locale = { version = "0.3", features = ["js"] }
wgpu = { version = "27.0.1", optional = true, default-features = false, features = ["std", "webgpu", "webgl"] }
web-time = "1.1.0"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Location", "Response", "console", "Crypto", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlElement", "Element", "Node", "Event", "EventTarget", "ClipboardEvent", "DataTransfer", "DataTransferItem", "DataTransferItemList", "File", "FileList"] }

[build-dependencies]
embed-resource = "3"

[lints]
workspace = true

[dev-dependencies]
base64 = "0.23.1"
egui_kittest = { version = "0.33.3", features = ["eframe", "snapshot", "wgpu"] }
