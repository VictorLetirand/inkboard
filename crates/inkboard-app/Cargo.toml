[package]
name = "inkboard-app"
description = "Inkboard desktop application (egui)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "inkboard"
path = "src/main.rs"

[dependencies]
arboard = "3.7.0"
eframe = { version = "0.33.3", features = ["wgpu"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rfd = "0.17.2"
serde_json = "1.0.154"
inkboard-core = { path = "../inkboard-core" }
inkboard-pen = { path = "../inkboard-pen" }
raw-window-handle = "0.6.2"
inkboard-formats = { path = "../inkboard-formats" }
inkboard-mcp = { path = "../inkboard-mcp" }
inkboard-icons = { path = "../inkboard-icons" }
inkboard-session = { path = "../inkboard-session" }
inkboard-net = { path = "../inkboard-net" }
inkboard-fonts = { path = "../inkboard-fonts" }
sys-locale = "0.3"

[build-dependencies]
embed-resource = "3"

[lints]
workspace = true

[dev-dependencies]
base64 = "0.23.1"
egui_kittest = { version = "0.33.3", features = ["eframe", "snapshot", "wgpu"] }
