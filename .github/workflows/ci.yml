name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      # the licence test runs `cargo tree --offline` for every release target: all crates of Cargo.lock must be downloaded, not only the ones of this OS
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  # The web page (WebAssembly, glow renderer): builds it as a published page would be, and keeps the artifact for a few days.
  web:
    runs-on: ubuntu-latest
    env:
      # `ring` (through iroh) compiles C for wasm32: a clang with the WebAssembly backend
      CC_wasm32_unknown_unknown: clang
      AR_wasm32_unknown_unknown: llvm-ar
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld llvm
      - name: Install Trunk 0.22.0 (checked against its published SHA-256)
        run: |
          curl -fsSL -o trunk.tar.gz https://github.com/trunk-rs/trunk/releases/download/v0.22.0/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo "f78c1989240c56592d8cfc4df5cc27399a3ff66a3f9cc819e16f1e3d809ce7c2  trunk.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf trunk.tar.gz -C "$HOME/.local/bin" trunk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the page
        working-directory: crates/inkboard-app/web
        run: trunk build --release
      - name: The page holds what a static host needs
        working-directory: crates/inkboard-app/web/dist
        run: |
          ls -l
          test -f index.html && test -f icons.bin && ls ./*.wasm ./*.js
      - uses: actions/upload-artifact@v4
        with:
          name: inkboard-web
          path: crates/inkboard-app/web/dist
          retention-days: 7
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `-W unmaintained`: unmaintained crates only warn (see deny.toml).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: -W unmaintained
