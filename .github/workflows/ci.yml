name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      # the licence test runs `cargo tree --offline` for every release target: all crates of Cargo.lock must be downloaded, not only the ones of this OS
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `-W unmaintained`: unmaintained crates only warn (see deny.toml).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: -W unmaintained
