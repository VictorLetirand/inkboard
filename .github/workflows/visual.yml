name: Visual

# Visual regression tests of the application (crates/inkboard-app/src/tests_visual.rs): window captures and exports compared to the
# reference images of crates/inkboard-app/tests/snapshots/. The references are those of Linux with software rendering, so
# this is the only job that runs them (INKBOARD_SNAPSHOTS=1).
#
# First run / new references: run this workflow by hand (workflow_dispatch) with `update` ticked. It renders every image,
# pushes them to the branch `visual-references` (an artifact upload hit the free account's storage quota on the first run);
# fetch that branch and add the PNG files to crates/inkboard-app/tests/snapshots/ in a commit on main.
# A normal run fails when a reference is missing or different; the new and difference images are then uploaded (3 days).
# The `push` trigger (branches: [main]) is added back once the Linux references are committed.
on:
  workflow_dispatch:
    inputs:
      update:
        description: "Generate the reference images (UPDATE_SNAPSHOTS=force) and push them to the branch visual-references"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # only used by the update run, to push the references branch
    env:
      INKBOARD_SNAPSHOTS: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      UPDATE_SNAPSHOTS: ${{ inputs.update && 'force' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Linux dependencies (virtual display, software OpenGL / Vulkan)
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri libxkbcommon-x11-0 mesa-vulkan-drivers

      - name: Visual regression tests
        run: xvfb-run -a cargo test -p inkboard-app tests_visual

      - name: Upload the new and difference images (failure only)
        if: failure() && !inputs.update
        uses: actions/upload-artifact@v4
        with:
          name: visual-differences
          path: |
            crates/inkboard-app/tests/snapshots/*.diff.png
            crates/inkboard-app/tests/snapshots/*.new.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Push the generated references to a branch (update run only)
        if: inputs.update && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B visual-references
          git add -- crates/inkboard-app/tests/snapshots/
          git commit -m "test(app): Linux reference images for the visual tests"
          git push --force origin visual-references
