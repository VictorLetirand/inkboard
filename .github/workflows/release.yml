name: Release

# Publishes downloadable installers (GitHub Releases) when a "v*" tag is pushed (e.g. v0.1.0),
# or on demand (workflow_dispatch: nothing is published, we only check that the installers build).
# Installers are attached directly to the Release (no "artifacts": a free account's artifact storage quota is quickly reached).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the Release (pre-release if the tag contains a hyphen)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes             $(case "$TAG" in *-*) echo --prerelease;; esac)

  package:
    needs: create-release
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: macos-14, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Linux dependencies (AppImage)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 libxkbcommon-dev libwayland-dev

      - name: Checks
        run: |
          cargo fmt --all --check
          cargo test --workspace

      - name: Build
        run: cargo build --release -p inkboard-app -p inkboard-cli -p inkboard-mcp

      - name: Packaging tool
        run: cargo install cargo-packager --locked

      # --- Signing (optional) ---------------------------------------------------------------
      # Without secrets, installers are produced UNSIGNED (SmartScreen warning on Windows, Gatekeeper on macOS).
      # macOS: set the secrets APPLE_CERTIFICATE (.p12 in base64), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #         APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID: cargo-packager signs and notarizes.
      # Windows : voir docs/DISTRIBUTION.md (SignPath Foundation, gratuit pour l'open source, ou Azure Trusted Signing).
      - name: Empaquetage
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo packager --release -c Packager.toml --formats all

      - name: Empreintes SHA-256
        shell: bash
        run: |
          cd dist
          for f in *.exe *.msi *.dmg *.deb *.AppImage; do
            [ -f "$f" ] && (sha256sum "$f" 2>/dev/null || shasum -a 256 "$f") >> "SHA256SUMS-${{ matrix.name }}.txt"
          done
          ls -l

      - name: Attach the installers to the Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          shopt -s nullglob
          files=(*.exe *.msi *.dmg *.deb *.AppImage SHA256SUMS-*.txt)
          [ ${#files[@]} -gt 0 ] || { echo "aucun installeur produit"; exit 1; }
          gh release upload "$TAG" "${files[@]}" --clobber --repo "${{ github.repository }}"
