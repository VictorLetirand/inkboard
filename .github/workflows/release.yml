name: Release

# Publishes downloadable installers (GitHub Releases) when a "v*" tag is pushed (e.g. v0.1.0),
# or on demand (workflow_dispatch: nothing is published, we only check that the installers build).
# Installers are attached directly to the Release (no "artifacts": a free account's artifact storage quota is quickly reached).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the Release (pre-release if the tag contains a hyphen)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-file .github/RELEASE_NOTES_TEMPLATE.md --generate-notes $(case "$TAG" in *-*) echo --prerelease;; esac)

  package:
    needs: create-release
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: macos-14, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      # Windows code signing (Azure Artifact Signing, formerly Trusted Signing). Optional: without these secrets the installers are unsigned.
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
      SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
      SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Linux dependencies (AppImage)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 libxkbcommon-dev libwayland-dev

      - name: Checks
        run: |
          cargo fmt --all --check
          cargo test --workspace

      - name: Build
        run: cargo build --release -p inkboard-app -p inkboard-cli -p inkboard-mcp

      - name: Packaging tool
        run: cargo install cargo-packager --locked

      # --- Signing (optional) ---------------------------------------------------------------
      # Without secrets, installers are produced UNSIGNED (SmartScreen warning on Windows, Gatekeeper on macOS); see docs/DISTRIBUTION.md.
      # Windows: set the secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET and the variables SIGNING_ENDPOINT, SIGNING_ACCOUNT,
      #          SIGNING_PROFILE (Azure Artifact Signing): the executables, then the installers, are signed and timestamped.
      # macOS: set the secrets APPLE_CERTIFICATE (.p12 in base64), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #        APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID: cargo-packager signs and notarizes.
      - name: Sign the executables (Windows)
        if: runner.os == 'Windows' && env.AZURE_TENANT_ID != ''
        uses: Azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\target\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo packager --release -c Packager.toml --formats all

      - name: Sign the installers (Windows)
        if: runner.os == 'Windows' && env.AZURE_TENANT_ID != ''
        uses: Azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: SHA-256 checksums
        shell: bash
        run: |
          cd dist
          for f in *.exe *.msi *.dmg *.deb *.AppImage; do
            [ -f "$f" ] && (sha256sum "$f" 2>/dev/null || shasum -a 256 "$f") >> "SHA256SUMS-${{ matrix.name }}.txt"
          done
          ls -l

      - name: Attach the installers to the Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          shopt -s nullglob
          files=(*.exe *.msi *.dmg *.deb *.AppImage SHA256SUMS-*.txt)
          [ ${#files[@]} -gt 0 ] || { echo "no installer produced"; exit 1; }
          gh release upload "$TAG" "${files[@]}" --clobber --repo "${{ github.repository }}"

  # Publishes the new version to the Windows Package Manager (winget) once the installers are attached. Only for stable tags (no hyphen),
  # and only when the secret WINGET_TOKEN (a classic token with `public_repo`) is set. The first version of a package is submitted by hand
  # (see docs/DISTRIBUTION.md); this job then keeps it up to date.
  winget:
    needs: package
    if: ${{ !contains(github.ref_name, '-') && startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the token
        id: token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: echo "present=$([ -n "$WINGET_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Submit to winget-pkgs
        if: steps.token.outputs.present == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Inkboard.Inkboard
          installers-regex: '_x64-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
