name: Release

# Publishes downloadable installers (GitHub Releases) when a "v*" tag is pushed (e.g. v0.1.0),
# or on demand (workflow_dispatch: nothing is published, we only check that the installers build).
# Installers are attached directly to the Release (no "artifacts": a free account's artifact storage quota is quickly reached).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the Release (pre-release if the tag contains a hyphen)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-file .github/RELEASE_NOTES_TEMPLATE.md --generate-notes $(case "$TAG" in *-*) echo --prerelease;; esac)

  package:
    needs: create-release
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the Installway image is an ltsc2022 Windows container
          - { os: windows-2022, name: windows-x64 }
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: macos-14, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      # Windows code signing (Azure Artifact Signing, formerly Trusted Signing). Optional: without these secrets the installers are unsigned.
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
      SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
      SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Linux dependencies (AppImage)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 libxkbcommon-dev libwayland-dev

      - name: Checks
        run: |
          # every crate of Cargo.lock must be in the cache: the licence test runs `cargo tree --offline` for all release targets
          cargo fetch --locked
          cargo fmt --all --check
          cargo test --workspace

      - name: Build
        run: cargo build --release -p inkboard-app -p inkboard-cli -p inkboard-mcp

      - name: Packaging tool
        if: runner.os != 'Windows'
        run: cargo install cargo-packager --locked

      # --- Signing (optional) ---------------------------------------------------------------
      # Without secrets, installers are produced UNSIGNED (SmartScreen warning on Windows, Gatekeeper on macOS); see docs/DISTRIBUTION.md.
      # Windows: set the secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET and the variables SIGNING_ENDPOINT, SIGNING_ACCOUNT,
      #          SIGNING_PROFILE (Azure Artifact Signing): the executables, then the installers, are signed and timestamped.
      # macOS: set the secrets APPLE_CERTIFICATE (.p12 in base64), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #        APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID: cargo-packager signs and notarizes.
      - name: Sign the executables (Windows)
        if: runner.os == 'Windows' && env.AZURE_TENANT_ID != ''
        uses: Azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\target\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package
        if: runner.os == 'Linux'
        run: cargo packager --release -c Packager.toml --formats all

      - name: Package with Installway (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Select-String -Path Packager.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $payload = 'dist/installway'
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item target/release/inkboard.exe, target/release/ink.exe, target/release/inkboard-mcp.exe -Destination $payload
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, THIRD_PARTY_LICENSES.md -Destination $payload
          $out = "dist/inkboard_${v}_x64-setup.exe"
          docker run --rm -v "${PWD}:C:\work" ghcr.io/tooltip-focus/installway:latest --to-version $v --out $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # GUI-subsystem exe: `&` would not wait for it
          $p = Start-Process -FilePath $out -ArgumentList '--verify' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { Write-Host "::error::$out --verify exited with code $($p.ExitCode)"; exit 1 }
          Remove-Item -Recurse -Force $payload

      # `hdiutil: ... Resource busy` happens now and then on the macOS runners (create-dmg): the packaging is tried up to 3 times
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for attempt in 1 2 3; do
            cargo packager --release -c Packager.toml --formats all && exit 0
            echo "::warning::packaging failed (attempt $attempt of 3)"
            hdiutil detach /Volumes/Inkboard -force 2>/dev/null || true
            rm -rf dist/*.dmg dist/*.app dist/.cargo-packager 2>/dev/null || true
            sleep 15
          done
          exit 1

      - name: Sign the installers (Windows)
        if: runner.os == 'Windows' && env.AZURE_TENANT_ID != ''
        uses: Azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: SHA-256 checksums
        shell: bash
        run: |
          cd dist
          for f in *.exe *.dmg *.deb *.AppImage; do
            [ -f "$f" ] && (sha256sum "$f" 2>/dev/null || shasum -a 256 "$f") >> "SHA256SUMS-${{ matrix.name }}.txt"
          done
          ls -l

      # Manual runs publish nothing: the Windows installer is kept for 3 days so that it can be tried by hand (`gh run download <id>`).
      - name: Keep the Windows installer (manual runs)
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*-setup.exe
            dist/SHA256SUMS-*.txt
          retention-days: 3

      - name: Attach the installers to the Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          shopt -s nullglob
          files=(*.exe *.dmg *.deb *.AppImage SHA256SUMS-*.txt)
          [ ${#files[@]} -gt 0 ] || { echo "no installer produced"; exit 1; }
          gh release upload "$TAG" "${files[@]}" --clobber --repo "${{ github.repository }}"

      # --- Installer checks (manual runs only) ------------------------------------------------------
      # Install each installer for real, launch the INSTALLED application (--screenshot + scripts/check_png.py), uninstall, check the
      # uninstall. They run only for workflow_dispatch and come after every build / sign / publish step, so a real tag publication
      # (installers already attached to the Release) can never be blocked or changed by them. Here a failure is meant to be red.
      # Each step expects exactly one match of its glob and lists dist/ otherwise.
      # Every launch is bounded to 120 s; logs and screenshots are uploaded only on failure (3 days).
      - name: Check the Installway installer (Windows)
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 15
        run: |
          $f = @(Get-ChildItem dist -Filter '*-setup.exe')
          if ($f.Count -ne 1) { Get-ChildItem dist | Out-Host; throw "expected one *-setup.exe in dist/, found $($f.Count)" }
          ./scripts/check_installer_windows.ps1 -Installer $f[0].FullName -Png installer-check/installway.png

      - name: Check the .deb and the AppImage (Linux)
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        shell: bash
        timeout-minutes: 15
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p installer-check
          sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri libxkbcommon-x11-0 mesa-vulkan-drivers
          one() { # one <glob in dist/>: prints the single matching file
            local f=( dist/$1 )
            if [ ${#f[@]} -ne 1 ] || [ ! -e "${f[0]}" ]; then echo "expected exactly one $1 in dist/:" >&2; ls -l dist >&2; exit 1; fi
            echo "${f[0]}"
          }
          launch() { xvfb-run -a -s "-screen 0 1920x1080x24" /usr/bin/timeout 120 "$@"; }

          # .deb: install with its dependencies, launch the installed binary, remove, check it is gone
          deb=$(one '*.deb')
          pkg=$(dpkg-deb -f "$deb" Package)
          sudo apt-get install -y "$PWD/$deb"
          bin=""
          for p in $(dpkg -L "$pkg" | grep -E '/inkboard$'); do
            if [ -f "$p" ] && [ -x "$p" ]; then bin=$p; break; fi
          done
          [ -n "$bin" ] || { echo "no inkboard executable in package $pkg:" >&2; dpkg -L "$pkg" >&2; exit 1; }
          echo "Installed binary: $bin"
          launch "$bin" --screenshot installer-check/deb.png
          python3 scripts/check_png.py installer-check/deb.png
          sudo apt-get remove -y "$pkg"
          if [ -e "$bin" ] || dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q 'ok installed'; then echo "$pkg is still installed after apt-get remove" >&2; exit 1; fi

          # AppImage: no FUSE needed with --appimage-extract-and-run
          img=$(one '*.AppImage')
          chmod +x "$img"
          # absolute output path: the AppImage may change directory before running the application
          launch "$PWD/$img" --appimage-extract-and-run --screenshot "$PWD/installer-check/appimage.png"
          python3 scripts/check_png.py installer-check/appimage.png

      - name: Check the .dmg (macOS)
        if: github.event_name == 'workflow_dispatch' && runner.os == 'macOS'
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p installer-check
          f=( dist/*.dmg )
          if [ ${#f[@]} -ne 1 ] || [ ! -e "${f[0]}" ]; then echo "expected exactly one *.dmg in dist/:" >&2; ls -l dist >&2; exit 1; fi
          mnt=$(mktemp -d)
          # the dmg carries a license agreement (license-file): accept it, otherwise "hdiutil: attach canceled"
          printf 'Y\n' | hdiutil attach "${f[0]}" -mountpoint "$mnt" -nobrowse -readonly
          trap 'hdiutil detach "$mnt" -force >/dev/null 2>&1 || true' EXIT
          app=$(find "$mnt" -maxdepth 1 -name '*.app' | head -n 1)
          [ -n "$app" ] || { echo "no .app in the dmg:" >&2; ls -l "$mnt" >&2; exit 1; }
          ditto "$app" "$RUNNER_TEMP/installed.app"
          hdiutil detach "$mnt"
          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$RUNNER_TEMP/installed.app/Contents/Info.plist")
          echo "Installed binary: $RUNNER_TEMP/installed.app/Contents/MacOS/$exe"
          perl -e 'alarm 120; exec @ARGV' -- "$RUNNER_TEMP/installed.app/Contents/MacOS/$exe" --screenshot installer-check/dmg.png
          python3 scripts/check_png.py installer-check/dmg.png
          rm -rf "$RUNNER_TEMP/installed.app"

      - name: Upload the installer check logs and screenshots (failure only)
        if: failure() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installer-check-${{ matrix.name }}
          path: installer-check/
          if-no-files-found: ignore
          retention-days: 3

  # Publishes the new version to the Windows Package Manager (winget) once the installers are attached. Only for stable tags (no hyphen),
  # and only when the secret WINGET_TOKEN (a classic token with `public_repo`) is set. The first version of a package is submitted by hand
  # (see docs/DISTRIBUTION.md); this job then keeps it up to date.
  winget:
    needs: package
    if: ${{ !contains(github.ref_name, '-') && startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the token
        id: token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: echo "present=$([ -n "$WINGET_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Submit to winget-pkgs
        if: steps.token.outputs.present == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Inkboard.Inkboard
          installers-regex: '_x64-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
