name: Release

# Publie des installeurs téléchargeables (GitHub Releases) quand on pousse une étiquette « v* » (ex. v0.1.0),
# ou à la demande (workflow_dispatch : rien n'est publié, on vérifie seulement que les installeurs se construisent).
# Les installeurs sont attachés directement à la Release (pas d'« artefacts » : le quota de stockage d'artefacts d'un compte gratuit est vite atteint).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer la Release (pré-version si l'étiquette contient un tiret)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes             $(case "$TAG" in *-*) echo --prerelease;; esac)

  package:
    needs: create-release
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: macos-14, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Dépendances Linux (AppImage)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 libxkbcommon-dev libwayland-dev

      - name: Vérifications
        run: |
          cargo fmt --all --check
          cargo test --workspace

      - name: Compilation
        run: cargo build --release -p wb-app -p wb-cli -p wb-mcp

      - name: Outil d'empaquetage
        run: cargo install cargo-packager --locked

      # --- Signature (facultative) ---------------------------------------------------------------
      # Sans secrets, les installeurs sont produits NON SIGNÉS (avertissement SmartScreen sous Windows, Gatekeeper sous macOS).
      # macOS : renseigner les secrets APPLE_CERTIFICATE (.p12 en base64), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #         APPLE_ID, APPLE_PASSWORD (mot de passe d'application), APPLE_TEAM_ID : cargo-packager signe et notarise.
      # Windows : voir docs/DISTRIBUTION.md (SignPath Foundation, gratuit pour l'open source, ou Azure Trusted Signing).
      - name: Empaquetage
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo packager --release -c Packager.toml --formats all

      - name: Empreintes SHA-256
        shell: bash
        run: |
          cd dist
          for f in *.exe *.msi *.dmg *.deb *.AppImage; do
            [ -f "$f" ] && (sha256sum "$f" 2>/dev/null || shasum -a 256 "$f") >> "SHA256SUMS-${{ matrix.name }}.txt"
          done
          ls -l

      - name: Joindre les installeurs à la Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          shopt -s nullglob
          files=(*.exe *.msi *.dmg *.deb *.AppImage SHA256SUMS-*.txt)
          [ ${#files[@]} -gt 0 ] || { echo "aucun installeur produit"; exit 1; }
          gh release upload "$TAG" "${files[@]}" --clobber --repo "${{ github.repository }}"
