<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inkboard web (spike S2)</title>
    <!-- features and renderer are chosen by build.ps1 (--features / --no-default-features) -->
    <link data-trunk rel="rust" href="../../crates/inkboard-app/Cargo.toml" data-bin="inkboard" data-wasm-opt="s" />
    <!-- the icon pack stays a separate file: fetched on demand by builds without `embedded-icons` -->
    <link data-trunk rel="copy-file" href="../../crates/inkboard-app/assets/icons.bin" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f4f4; }
      canvas { width: 100%; height: 100%; display: block; touch-action: none; }
      #status { position: fixed; left: 6px; bottom: 4px; font: 11px monospace; color: #666; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="inkboard_canvas"></canvas>
    <div id="status">loading...</div>
  </body>
</html>
