# Throwaway spike S1 (transport): evaluates `iroh` for Inkboard shared sessions.
# Not part of the root workspace on purpose.
[package]
name = "s1-iroh"
version = "0.0.0"
edition = "2024"
publish = false

# Empty workspace table: keeps this crate out of the Inkboard root workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "host"
required-features = ["native"]

[[bin]]
name = "guest"
required-features = ["native"]

[features]
native = ["tokio/full", "dep:tracing-subscriber"]

[dependencies]
anyhow = "1"
data-encoding = "2"
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
n0-future = "0.3"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tracing-subscriber-wasm = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"

# Optimised native build for measurements (the wasm size build uses `release`).
[profile.native]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
strip = false
panic = "unwind"

[profile.release]
codegen-units = 1
strip = "symbols"
debug = false
lto = true
opt-level = "z"
panic = "abort"
