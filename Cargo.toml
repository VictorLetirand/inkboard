[workspace]
resolver = "3"
members = ["crates/inkboard-core", "crates/inkboard-icons", "crates/inkboard-formats", "crates/inkboard-cli", "crates/inkboard-app", "crates/inkboard-pen", "crates/inkboard-mcp", "crates/inkboard-session", "crates/inkboard-net", "crates/inkboard-fonts", "crates/inkboard-crowd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
